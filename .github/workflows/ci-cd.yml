name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install
      working-directory: ./app

    - name: Test build
      run: echo "Build step complete."

    - name: Deployment step
      run: echo "Deployment handled externally (Render.com or Railway.app)"
